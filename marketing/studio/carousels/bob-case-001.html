const rain = (n = 140, op = 0.22, seed = 7) => {
  let s = seed; const r = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  let out = "";
  for (let k = 0; k < n; k++) { const x = r() * 1180 - 50, y = r() * 1400 - 50, l = 30 + r() * 60; out += `<line x1="${x}" y1="${y}" x2="${x - l * 0.25}" y2="${y + l}" stroke="#cfe3ff" stroke-width="${1.5 + r() * 1.5}" opacity="${op * (0.4 + r() * 0.6)}"/>`; }
  return `<svg class="rain" width="1080" height="1350">${out}</svg>`;
};

// ---------------------------------------------------------------- the city
const city = (seed, base = 1000, color = "#0e1520") => {
  let s = seed; const r = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  let x = -10, out = "";
  while (x < 1100) {
    const w = 90 + r() * 140, h = 280 + r() * 420;
    out += `<rect x="${x}" y="${base - h}" width="${w}" height="${h + 500}" fill="${color}"/>`;
    for (let wy = base - h + 30; wy < base - 20; wy += 46) for (let wx = x + 16; wx < x + w - 20; wx += 34) if (r() > 0.72) out += `<rect x="${wx}" y="${wy}" width="14" height="20" fill="#ffcf7a" opacity="${0.3 + r() * 0.5}"/>`;
    x += w + 6;
  }
  return out;
};
