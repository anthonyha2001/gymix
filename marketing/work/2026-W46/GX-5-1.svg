<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" data-size="A4 210x297mm"><rect width="794" height="1123" fill="#f4f5f2"/><rect width="794" height="360" fill="#0d1117"/><g transform="translate(56,52) scale(56)"><rect width="100" height="100" rx="22" fill="#c8f135"/><g transform="translate(3,-1.5)" fill="none" stroke="#0d1117" stroke-linejoin="round"><path d="M47.6 35.5 A27 23 0 1 0 69 58 H48" stroke-width="16" stroke-linecap="butt"/><path d="M60.8 29.1 A13 13 0 0 1 71.9 40.2" stroke-width="8.5" stroke-linecap="round"/><path d="M62.3 18.2 A24 24 0 0 1 82.8 38.7" stroke-width="8.5" stroke-linecap="round"/></g></g><text x="124" y="95" font-family="Geist, Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#fff" text-anchor="start" >Gymix</text><text x="56" y="190" font-family="Geist, Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#fff" text-anchor="start" >Your gym,</text><text x="56" y="260" font-family="Geist, Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#c8f135" text-anchor="start" >running itself.</text><text x="56" y="312" font-family="Geist, Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#e2e4de" text-anchor="start" >The all-in-one gym system built for Lebanon.</text><text x="56" y="340" font-family="Geist, Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start" >$29.99 a month. 14 days free.</text><rect x="56" y="395" width="682" height="104" rx="18" fill="#fff" stroke="#e2e4de"/><rect x="76" y="421" width="10" height="52" rx="5" fill="#c8f135"/><text x="106" y="441" font-family="Geist, Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0d1117" text-anchor="start" >Get paid</text><text x="106" y="473" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5d6470" text-anchor="start" >Unpaid members freeze automatically. See who owes what. Dollars and lira at your own rate.</text><rect x="56" y="515" width="682" height="104" rx="18" fill="#fff" stroke="#e2e4de"/><rect x="76" y="541" width="10" height="52" rx="5" fill="#c8f135"/><text x="106" y="561" font-family="Geist, Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0d1117" text-anchor="start" >Tap to check in</text><text x="106" y="593" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5d6470" text-anchor="start" >A $1 sticker at the door. No hardware.</text><rect x="56" y="635" width="682" height="104" rx="18" fill="#fff" stroke="#e2e4de"/><rect x="76" y="661" width="10" height="52" rx="5" fill="#c8f135"/><text x="106" y="681" font-family="Geist, Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0d1117" text-anchor="start" >A member app</text><text x="106" y="713" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5d6470" text-anchor="start" >Programs, classes and progress. No store download.</text><rect x="56" y="755" width="682" height="104" rx="18" fill="#fff" stroke="#e2e4de"/><rect x="76" y="781" width="10" height="52" rx="5" fill="#c8f135"/><text x="106" y="801" font-family="Geist, Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#0d1117" text-anchor="start" >Your whole team</text><text x="106" y="833" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5d6470" text-anchor="start" >Owner, manager, front desk and trainers, each with their own access.</text><rect x="56" y="885" width="682" height="200" rx="22" fill="#0d1117"/><rect x="80" y="905" width="160" height="160" rx="8" fill="#fff" stroke="#0d1117" stroke-width="2" stroke-dasharray="8 6"/><text x="160.0" y="981.0" font-family="Geist, Inter, Arial, sans-serif" font-size="35.2" font-weight="800" fill="#0d1117" text-anchor="middle" >QR</text><text x="160.0" y="1001.0" font-family="Geist, Inter, Arial, sans-serif" font-size="12.8" font-weight="600" fill="#0d1117" text-anchor="middle" >&#8594; [WEBSITE]/demo</text><text x="160.0" y="1017.0" font-family="Geist, Inter, Arial, sans-serif" font-size="9.6" font-weight="600" fill="#5d6470" text-anchor="middle" >PLACEHOLDER</text><text x="268" y="945" font-family="Geist, Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#c8f135" text-anchor="start" >Run a gym for a day.</text><text x="268" y="980" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#fff" text-anchor="start" >Try the live demo: [WEBSITE]/demo</text><text x="268" y="1008" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#fff" text-anchor="start" >Start free: [WEBSITE]/signup</text><text x="268" y="1036" font-family="Geist, Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#fff" text-anchor="start" >WhatsApp: [WHATSAPP_SALES]</text><text x="268" y="1066" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#a9d10f" text-anchor="start" >No sign-up for the demo. No card for the trial.</text></svg>
